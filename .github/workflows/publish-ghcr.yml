name: Publish backend image to GHCR

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/shared-medusa-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.turbo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy hooks
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          KORONAKERT_HOOK: ${{ secrets.COOLIFY_KORONAKERT_DEPLOY_WEBHOOK }}
          TEHERGUMINET_HOOK: ${{ secrets.COOLIFY_TEHERGUMINET_DEPLOY_WEBHOOK }}
        run: |
          trigger() {
            local name="$1"
            local url="$2"
            if [ -n "$url" ]; then
              echo "Triggering $name"
              curl -fsSL -X POST "$url"
            else
              echo "Skipping $name (secret not configured)"
            fi
          }

          trigger "KORONAKERT" "$KORONAKERT_HOOK"
          trigger "TEHERGUMINET" "$TEHERGUMINET_HOOK"
