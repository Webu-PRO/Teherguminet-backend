name: Test CLI
on:
  pull_request:
    branches:
      - 'master'
      - 'ci'

# This project installs with Yarn Classic (committed yarn.lock + .yarnrc.yml,
# pinned via corepack to yarn@1.22.22 — see the production Dockerfile). It has
# no package-lock.json or pnpm-lock.yaml, and the Medusa framework relies on
# hoisted (flat) node_modules, so npm/pnpm installs do not work here. The single
# Yarn job below mirrors the Dockerfile's install + a build so the gate reflects
# how the app is actually built and deployed.
jobs:
  test-cli:
    name: "Test CLI (Yarn)"
    runs-on: ubuntu-latest
    env:
      NODE_ENV: CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Activate pinned Yarn via corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --pure-lockfile --production=false --network-timeout 600000

      - name: Check CLI tool is installed
        run: ./node_modules/.bin/medusa -v

      - name: Build
        run: yarn build
