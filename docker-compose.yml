version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: deadpool
      POSTGRES_PASSWORD: Kroschu.1236547890
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Codex CLI sidecar used by AI AGENT HU->SK translation
  codex-sidecar:
    build:
      context: .
      dockerfile: codex-sidecar/Dockerfile
    container_name: medusa_codex_sidecar
    restart: unless-stopped
    environment:
      - CODEX_SIDECAR_PORT=3210
      - AI_AGENT_CODEX_MODEL=${AI_AGENT_CODEX_MODEL:-gpt-5.3-codex}
      - AI_AGENT_CODEX_LOGIN_COMMAND=${AI_AGENT_CODEX_LOGIN_COMMAND:-docker compose exec codex-sidecar codex login --device-auth}
    volumes:
      - codex_auth_data:/home/node/.codex
    networks:
      - medusa_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3210/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Medusa Server
  medusa:
    build:
      context: .
      dockerfile: Dockerfile.turbo
      args:
        TURBO_TEAM: ${TURBO_TEAM:-}
        TURBO_TOKEN: ${TURBO_TOKEN:-}
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex-sidecar:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CI=${CI:-1}
      - MEDUSA_DISABLE_TELEMETRY=${MEDUSA_DISABLE_TELEMETRY:-1}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - RUN_SEED=${RUN_SEED:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql://deadpool:Kroschu.1236547890@postgres:5432/medusa-store}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_AGENT_CODEX_SIDECAR_URL=${AI_AGENT_CODEX_SIDECAR_URL:-http://codex-sidecar:3210}
      - AI_AGENT_CODEX_MODEL=${AI_AGENT_CODEX_MODEL:-gpt-5.3-codex}
      - AI_AGENT_CODEX_LOGIN_COMMAND=${AI_AGENT_CODEX_LOGIN_COMMAND:-docker compose exec codex-sidecar codex login --device-auth}
    env_file:
      - .env
    networks:
      - medusa_network
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # Service
      - traefik.http.services.medusa.loadbalancer.server.port=9000

      # HTTPS router
      - traefik.http.routers.medusa-admin.rule=Host(`admin.teherguminet.hu`)
      - traefik.http.routers.medusa-admin.entrypoints=https # or websecure
      - traefik.http.routers.medusa-admin.tls=true
      - traefik.http.routers.medusa-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.medusa-admin.service=medusa # bind router → service
      - traefik.http.routers.medusa-admin.middlewares=medusa-admin-redirect

      # HTTP → HTTPS
      - traefik.http.routers.medusa-admin-http.rule=Host(`admin.teherguminet.hu`)
      - traefik.http.routers.medusa-admin-http.entrypoints=http # or web
      - traefik.http.routers.medusa-admin-http.middlewares=medusa-force-https,medusa-admin-redirect
      - traefik.http.middlewares.medusa-force-https.redirectscheme.scheme=https
      - traefik.http.middlewares.medusa-force-https.redirectscheme.permanent=true
      - traefik.http.middlewares.medusa-admin-redirect.redirectregex.regex=^https?://([^/]+)/?$
      - traefik.http.middlewares.medusa-admin-redirect.redirectregex.replacement=https://$1/app
      - traefik.http.middlewares.medusa-admin-redirect.redirectregex.permanent=true

volumes:
  postgres_data:
  codex_auth_data:

networks:
  medusa_network:
    driver: bridge
  coolify:
    external: true
